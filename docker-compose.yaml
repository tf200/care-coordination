services:

  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: care-coordination-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-care_coordination}
    ports:
      - "${DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - care-coordination-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-care_coordination}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: care-coordination-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - care-coordination-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: quay.io/minio/minio
    container_name: care-coordination-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - care-coordination-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: care-coordination-migrate
    env_file:
      - .env
    environment:
      DB_SOURCE: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-care_coordination}?sslmode=disable
      DB_MIGRATE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-care_coordination}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - care-coordination-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: care-coordination-app
    restart: unless-stopped
    ports:
      - "8086:8080"
    env_file:
      - .env
    environment:
      DB_SOURCE: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-care_coordination}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - care-coordination-network

  # Notification Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: care-coordination-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_SOURCE: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-care_coordination}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - care-coordination-network

  # Manual first-user bootstrap. Start with:
  # docker compose --profile tools run --rm admin
  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    env_file:
      - .env
    environment:
      DB_SOURCE: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-care_coordination}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - care-coordination-network

networks:
  care-coordination-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
